<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ roomName }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: var(--chat-bg);">
  <div *ngFor="let m of messages" [style.display]="'flex'"
    [style.justify-content]="m.user_id === currentUser?.uid ? 'flex-end' : 'flex-start'" class="ion-margin-bottom">

    <ion-card
      [style.--background]="m.user_id === currentUser?.uid ? 'var(--chat-my-bubble)' : 'var(--chat-other-bubble)'"
      style="margin: 0; max-width: 82%; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.18);">
      <ion-card-content style="padding: 10px 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <ion-avatar style="width: 24px; height: 24px;">
              <img [src]="m.user_avatar" />
            </ion-avatar>
            <strong style="font-size: 13px; color: var(--ion-color-primary);">
              {{ m.user_id === currentUser?.uid ? 'Yo' : m.user_name }}
            </strong>
          </div>
          <ion-button *ngIf="m.user_id === currentUser?.uid" fill="clear" color="danger" size="small"
            style="margin: 0; height: 24px;" (click)="deleteMsg(m.id)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </div>

        <p *ngIf="m.file_type === 'text'" style="margin-top: 6px; color: var(--ion-text-color);">{{ m.text }}</p>

        <img *ngIf="m.file_type === 'image'" [src]="m.file_url"
          style="border-radius: 8px; margin-top: 8px; max-height: 220px;" />

        <div *ngIf="m.file_type === 'file'" style="margin-top: 8px;">
          <a [href]="m.file_url" target="_blank" style="color: var(--ion-color-primary); font-weight: 600;">
            <ion-icon name="document-outline"></ion-icon> Descargar: {{ m.text }}
          </a>
        </div>

        <div *ngIf="m.file_type === 'location'" style="margin-top: 8px;">
          <a [href]="'https://www.google.com/maps/search/?api=1&query=' + m.lat + ',' + m.lng" target="_blank"
            style="color: var(--ion-color-primary); font-weight: 600;">
            📍 Ver ubicación exacta ({{ m.lat | number:'1.4-4' }}, {{ m.lng | number:'1.4-4' }})
          </a>
        </div>

        <small style="opacity: 0.65; display: block; text-align: right; font-size: 11px; margin-top: 4px;">
          {{ m.created_at | date:'shortTime' }}
        </small>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar style="--background: var(--ion-tab-bar-background); --color: var(--ion-text-color);">
    <input type="file" #fileInput style="display: none" (change)="onFileSelected($event)" />
    <ion-buttons slot="start">
      <ion-button (click)="sendPhoto()"><ion-icon name="camera"></ion-icon></ion-button>
      <ion-button (click)="fileInput.click()"><ion-icon name="attach"></ion-icon></ion-button>
      <ion-button (click)="sendLocation()"><ion-icon name="location"></ion-icon></ion-button>
    </ion-buttons>
    <ion-input placeholder="Escribe un mensaje..." [(ngModel)]="newMessage" (keyup.enter)="sendText()"></ion-input>
    <ion-buttons slot="end">
      <ion-button color="primary" (click)="sendText()"><ion-icon name="send"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
